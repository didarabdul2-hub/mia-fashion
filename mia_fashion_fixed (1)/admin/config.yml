backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Mia Fashion Products"
    files:
      - name: "products"
        label: "Products"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - ৳{{fields.price}}"
            fields:
              - { label: "Product Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "number", value_type: "int" }
              - { label: "Product Image", name: "image", widget: "image", required: false }
